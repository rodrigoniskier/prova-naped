name: Django tests
on:
  pull_request:
  push:
    branches: [main, feature/importacao-questoes-componentes]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check --settings=gerador_provas.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=gerador_provas.test_settings
      - run: python manage.py test --settings=gerador_provas.test_settings --verbosity=2
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test questoes.test_browser --settings=gerador_provas.test_settings --verbosity=2
        env:
          RUN_BROWSER_TESTS: '1'
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1 ruff==0.17.2
      - run: pip-audit -r requirements.txt
      - run: ruff check questoes/importacao.py questoes/importacao_admin.py questoes/importacao_forms.py questoes/tests.py questoes/test_browser.py questoes/admin.py questoes/models.py scripts gerador_provas/test_settings.py
